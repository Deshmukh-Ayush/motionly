[project]
name = "motionly-engine"
version = "0.2.0"
description = "Motionly engine: measure timing and easing from motion graphics videos"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "scipy>=1.17.1",
    "typer>=0.27.3",
]

[project.scripts]
motionly = "motionly_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motionly_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
